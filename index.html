<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alex's Apps</title>
<meta name="theme-color" content="#1d2a24">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#17201c;--muted:#5d6762;--line:#dedcd4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e9ece9;--muted:#9aa49f;--line:#2b332f;color-scheme:dark}}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 40px}
h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 24px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.app{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none}
a.app:focus-visible{outline:3px solid #c99400;outline-offset:2px}
a.app img{width:52px;height:52px;border-radius:12px;flex:none}
a.app b{display:block;font-size:1.1rem}
a.app span{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main>
<h1>Apps</h1>
<p class="sub">Shared apps for friends and family.</p>
<ul>
  <li><a class="app" href="golf/"><img src="golf/icon-192.png" alt=""><div><b>Fairway Live</b><span>Live golf scoring at Doha Golf Club</span></div></a></li>
  <li><a class="app" href="meals/"><img src="meals/icon-192.png" alt=""><div><b>Meal Plan</b><span>Weekly meals and shopping lists</span></div></a></li>
</ul>
</main>
</body>
</html>
